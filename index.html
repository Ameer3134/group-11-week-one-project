<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Advice generator app</title>
    <link href="./output.css" rel="stylesheet">
</head>
<body class="bg-[hsl(218,23%,16%)] text-white">

        <div class="parent-container flex  flex-row items-center content-center m-0 w-screen h-screen justify-center ">




                <!-- container Div  -->


        <div class="container bg-[hsl(217,19%,24%)] text-center p-6 rounded-lg   flex flex-col  items-center justify-center w-[30%]  gap-5">

            <p class="adv text-[hsl(150,100%,66%)] ">
                ADVICE # 117
            </p>

            <p class="quote">
                “It is easy to sit up and take notice, what's difficult is getting up and taking action.”       

            </p>

             <img src="/images/pattern-divider-desktop.svg" alt="divider">

                <button class="get-advice bg-[hsl(150,100%,66%)] p-3 rounded-full hover:bg-[hsl(150,100%,76%)]">

                 <img src="/images/icon-dice.svg" alt="dice"  > 

                </button>
<button
    id="saveBtn"
    class="bg-[hsl(150,100%,66%)] text-black px-4 py-2 rounded mt-4 hover:bg-[hsl(150,100%,76%)]">

    ❤️ Save Favourite

</button>

<div class="w-full mt-5">

    <h3 class="text-[hsl(150,100%,66%)] text-lg mb-2">
        My Favourite Advice
    </h3>

    <ul id="favouritesList" class="text-left"></ul>

</div>
           
        </div>

        <div class="btn-image">
            <img src="/images/icon-dice.svg" alt="">
        </div>



        </div>  
        <!-- CLOSINNG TAG OF  PARENT DIV -->

    

    <script src="./index.js" defer></script>
</body>
</html>
